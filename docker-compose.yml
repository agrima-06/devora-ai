services:
  # --- PostgreSQL 16 with pgvector Extension ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devora}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devora_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-devora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis 7 (Caching & Message Broker) ---
  redis:
    image: redis:7-alpine
    container_name: devora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Devora AI Backend (FastAPI + LangGraph) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devora-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SHOWCASE_MODE: ${SHOWCASE_MODE:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-devora_secret_password}@postgres:5432/${POSTGRES_DB:-devora}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-devora-production-secure-random-secret-key-min-32-chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEVORA_MOCK_GITHUB: ${DEVORA_MOCK_GITHUB:-false}
      WORKSPACE_BASE_DIR: /tmp/devora/repos
      DEVORA_TASKS_DIR: /tmp/devora/tasks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace_data:/tmp/devora
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Devora AI Frontend (Next.js 14) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: devora-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  workspace_data:
